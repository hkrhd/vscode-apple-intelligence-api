name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run package
      - run: bun run test:package
      - uses: actions/upload-artifact@v7
        with:
          name: vscode-apple-intelligence-api-darwin-arm64
          path: .artifacts/*.vsix
          include-hidden-files: true
